listen_addr: "0.0.0.0:8787"
# Public API origin used to generate clickable/copyable GUID URLs in the admin UI.
# Include scheme and external port; do not add a path or trailing slash.
public_base_url: "https://portkeeper.example.com:8787"
default_ttl: "24h"
state_file: "/var/lib/portkeeper/state.json"

# Maximum requests from one client IP during the sliding time window.
rate_limit_requests: 10
rate_limit_window: "1m"

# Local web administration. The admin UI is served by the same binary.
# HTTP is the default; enable HTTPS only after installing a readable certificate/key.
admin:
  enabled: true
  listen_addr: "0.0.0.0:8083"
  https: false
  tls_cert_file: ""
  tls_key_file: ""

access:
  - guid: "REPLACE-WITH-SECRET-GUID-1"
    port: 8080
  - guid: "REPLACE-WITH-SECRET-GUID-2"
    port: 8090
